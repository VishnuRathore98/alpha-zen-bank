services:
  traefik:
    image: docker.io/traefik:v3.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./backend/docker/local/traefik/traefik.yml:/etc/traefik/traefik.yml
    networks:
      - alpha_zen_local_nw
    command:
      - --providers.docker

  api: &api
    build:
      context: .
      dockerfile: 
    volumes:
      - 
      - 
    ports:
      -


  postgres:
    build:
      context: .
      dockerfile: ./docker/local/postgres/Dockerfile
    ports:
      - "5433:5432"
    volumes:
      - alpha_zen_local_db:/var/lib/postgresql/data
    env_file:
      - ./.envs/.env.local
    networks:
      - alpha_zen_local_nw

networks:
  alpha_zen_local_nw:
    external: true

volumes:
  alpha_zen_local_db:
