<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
    }
    .container{
        max-width: 600px;
        margin: 20px auto;
        padding: 20;
        background-color: #f4f4f4;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    .header{
        text-align: center;
        padding: 20px 0;
        border-radius: 1px solid #eee;
    }
    .content{
        padding: 20px 0;
    }
    .footer{
        text-align: center;
        padding: 20px 0;
        border-top: 1px solid #eee;
        color: #666;
        font-size: 0.8em;
    }
    </style>
</head>
<body>
   <div class="container">{% block header %}{% endblock %}<h1></h1></div> 
   <div class="content">{% block content %}{% endblock %}</div>
   <div class="footer">{% footer %}{% endblock %}</div>
</body>
</html>
